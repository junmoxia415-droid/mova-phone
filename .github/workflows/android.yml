name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ------------------------------------------------------------------
  # 1) Calidad: pruebas unitarias + lint
  # ------------------------------------------------------------------
  quality:
    name: Pruebas y lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0 platform-tools'

      - name: Caché de Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Dar permisos al wrapper
        run: chmod +x ./gradlew

      - name: Pruebas unitarias
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Lint
        run: ./gradlew lintDebug --stacktrace

      - name: Publicar informes de pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: informes-pruebas
          path: |
            **/build/reports/tests/**
            **/build/reports/lint-results-*.html
          if-no-files-found: ignore

  # ------------------------------------------------------------------
  # 2) Compilación de depuración
  # ------------------------------------------------------------------
  debug:
    name: APK de depuración
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0 platform-tools'

      - name: Caché de Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compilar APK de depuración
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug --stacktrace

      - name: Publicar APK de depuración
        uses: actions/upload-artifact@v4
        with:
          name: mova-phone-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  # ------------------------------------------------------------------
  # 3) Compilación de release (APK + AAB), separada de la de depuración
  # ------------------------------------------------------------------
  release:
    name: APK y AAB de release
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0 platform-tools'

      - name: Caché de Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Preparar firma de release
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > app/mova-release.jks
            echo "MOVA_KEYSTORE_PATH=app/mova-release.jks" >> "$GITHUB_ENV"
            echo "MOVA_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "MOVA_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
            echo "MOVA_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "FIRMA=keystore de release" >> "$GITHUB_ENV"
          else
            echo "FIRMA=clave de desarrollo (sin secretos configurados)" >> "$GITHUB_ENV"
          fi

      - name: Compilar APK y AAB de release
        run: ./gradlew :app:assembleRelease :app:bundleRelease --stacktrace

      - name: Resumen de artefactos
        if: always()
        run: |
          echo "Firma usada: $FIRMA"
          ls -lh app/build/outputs/apk/release/ || true
          ls -lh app/build/outputs/bundle/release/ || true
          ls -lh app/build/outputs/mapping/release/ || true

      - name: Limpiar keystore temporal
        if: always()
        run: rm -f app/mova-release.jks

      - name: Publicar artefactos de release
        uses: actions/upload-artifact@v4
        with:
          name: mova-phone-release
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
            app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error
